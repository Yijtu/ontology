<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; connect-src 'none'; base-uri 'none'; form-action 'none'" />
  <title>连接中断</title>
  <style>
    :root { color-scheme: dark; }
    body {
      margin: 0; height: 100vh; display: grid; place-items: center;
      font-family: "Segoe UI", system-ui, sans-serif; background: #0f172a; color: #e2e8f0;
    }
    main { text-align: center; max-width: 420px; padding: 24px; }
    h1 { font-size: 18px; font-weight: 600; margin: 0 0 10px; }
    p { color: #94a3b8; font-size: 13px; line-height: 1.7; margin: 0 0 20px; }
    p.target { margin: 16px 0 0; font-size: 12px; color: #64748b; }
    button {
      padding: 10px 18px; font-size: 13px; border-radius: 8px; border: 1px solid #2563eb;
      background: #2563eb; color: #fff; cursor: pointer; font-weight: 600;
    }
  </style>
</head>
<body>
  <main>
    <h1>暂时连不上服务端</h1>
    <p>正在自动重试。请确认服务端地址可访问、网络与证书正常；如果令牌已更换，请从「应用 → 重新配置服务端」重新登录。</p>
    <button id="retry" type="button">立即重试</button>
    <p id="target" class="target"></p>
  </main>
  <script src="offline.js"></script>
</body>
</html>
