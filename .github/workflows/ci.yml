name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: platform
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          package_json_file: platform/package.json

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: platform/.nvmrc
          cache: pnpm
          cache-dependency-path: platform/pnpm-lock.yaml

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Lint dependency boundaries
        run: pnpm run lint

      - name: Typecheck
        run: pnpm run typecheck

      - name: Preload PostgreSQL 17 test image
        shell: bash
        run: |
          docker pull public.ecr.aws/docker/library/postgres:17
          docker tag public.ecr.aws/docker/library/postgres:17 postgres:17
          postgres_version="$(docker run --rm --tmpfs /var/lib/postgresql/data --entrypoint postgres postgres:17 --version)"
          printf '%s\n' "$postgres_version"
          case "$postgres_version" in
            "postgres (PostgreSQL) 17."*) ;;
            *) echo "expected PostgreSQL 17 test image, received: $postgres_version" >&2; exit 1 ;;
          esac

      - name: Test
        run: pnpm run test
