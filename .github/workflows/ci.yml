name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: platform
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          package_json_file: platform/package.json

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: platform/.nvmrc
          cache: pnpm
          cache-dependency-path: platform/pnpm-lock.yaml

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Lint dependency boundaries
        run: pnpm run lint

      - name: Typecheck
        run: pnpm run typecheck

      - name: Preload PostgreSQL 17 test image
        shell: bash
        run: |
          set -uo pipefail
          target='postgres:17'
          sources=(
            'mirror.gcr.io/library/postgres:17'
            'public.ecr.aws/docker/library/postgres:17'
            'docker.io/library/postgres:17'
          )
          max_attempts=3
          pulled=''
          for source in "${sources[@]}"; do
            for attempt in $(seq 1 "$max_attempts"); do
              printf 'pulling %s (attempt %d/%d)\n' "$source" "$attempt" "$max_attempts"
              if docker pull "$source"; then
                pulled="$source"
                break 2
              fi
              sleep $((attempt * 15))
            done
            printf '::warning::failed to pull %s from every attempt; trying next source\n' "$source"
          done
          if [ -z "$pulled" ]; then
            echo 'unable to pull postgres:17 from any known registry' >&2
            exit 1
          fi
          printf 'using %s as %s\n' "$pulled" "$target"
          docker tag "$pulled" "$target"
          postgres_version="$(docker run --rm --tmpfs /var/lib/postgresql/data --entrypoint postgres "$target" --version)"
          printf '%s\n' "$postgres_version"
          case "$postgres_version" in
            "postgres (PostgreSQL) 17."*) ;;
            *) echo "expected PostgreSQL 17 test image, received: $postgres_version" >&2; exit 1 ;;
          esac

      - name: Test
        run: pnpm run test
